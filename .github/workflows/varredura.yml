name: Varredura PNCP

on:
  schedule:
    # 09:23 UTC = 06:23 em America/Sao_Paulo (o Brasil não tem mais horário de verão).
    # O GitHub usa sempre UTC; se o fuso mudar, ajuste aqui.
    #
    # Por que 09:23 e não 10:00: agendamento em repositório gratuito entra numa fila
    # de baixa prioridade, e o topo da hora é o horário mais concorrido — é onde todo
    # mundo agenda. Em 31/08/2026 o job marcado para 10:00 UTC só pegou vaga às 17:27,
    # 7h27 depois, e a lista que devia estar pronta às 7h chegou às 14h27. Sair do :00
    # e antecipar meia hora dá folga para a fila sem perder o horário útil.
    - cron: '23 9 * * 1-5'
  workflow_dispatch:      # permite rodar na mão pelo botão "Run workflow"

# Sem isso o job não consegue commitar o dados.json de volta.
permissions:
  contents: write

# Duas execuções ao mesmo tempo dariam conflito no push.
concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guardar a versão anterior para comparar
        run: git show HEAD:docs/dados.json > /tmp/anterior.json 2>/dev/null || echo '{}' > /tmp/anterior.json

      - name: Varrer o PNCP
        run: node varredura.mjs

      - name: Gerar docs/dados.json
        run: node publicar.mjs

      # O tee manda o delta para o log ALÉM do Summary. O Summary não tem endpoint
      # na API REST, então sem isso o comparativo do dia só existe no navegador.
      - name: Resumo do que mudou
        run: |
          set -o pipefail
          node delta.mjs /tmp/anterior.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Trava de sanidade: lista vazia, encolhimento brusco ou muitas buscas
      # falhando derrubam o job ANTES do commit. Assim o dados.json de ontem
      # continua no ar — dado velho e inteiro é melhor que novo pela metade.
      - name: Conferir se o resultado faz sentido
        run: |
          { echo '### Sanidade'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          set +e
          node conferir.mjs /tmp/anterior.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          st=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $st

      - name: Publicar se houve mudança
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/dados.json; then
            echo "Nada mudou hoje — nenhum commit."
          else
            git add docs/dados.json
            git commit -m "Varredura de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi
