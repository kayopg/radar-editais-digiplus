name: Varredura PNCP

on:
  schedule:
    # Os horários abaixo são UTC, que é o único fuso que o GitHub aceita. O Brasil
    # não tem mais horário de verão, então BRT = UTC-3 o ano inteiro; se o fuso
    # mudar, ajuste aqui.
    #
    # Por que 09:23 e não 10:00: agendamento em repositório gratuito entra numa fila
    # de baixa prioridade, e o topo da hora é o horário mais concorrido — é onde todo
    # mundo agenda. Em 31/08/2026 o job marcado para 10:00 UTC só pegou vaga às 17:27,
    # 7h27 depois, e a lista que devia estar pronta às 7h chegou às 14h27. Sair do :00
    # e antecipar meia hora dá folga para a fila sem perder o horário útil.
    #
    # Só que não bastou: em 01/09/2026 o job das 09:23 ainda não tinha pegado vaga
    # 4h21 depois. A fila é best-effort e não há prioridade para comprar, então em vez
    # de perseguir o horário certo o jeito é tentar de novo. As janelas: a primeira
    # que conseguir vaga publica, e as seguintes olham o dados.json que está no ar,
    # veem a data de hoje e saem na hora — sem gastar os 35 min da varredura.
    #
    # 24/09/2026 — os horários foram medidos, e não estimados. Nas 19 execuções
    # agendadas entre 02/09 e 24/09, a espera da janela principal foi:
    #
    #   mínimo 4h12 · mediana 4h48 · p90 6h33 · maior 8h04
    #
    # Nunca menos de 4h12. E as três janelas do dia entram com as mesmas 2h de
    # intervalo com que foram agendadas (em 23/09 começaram 11:16, 13:28 e 15:52
    # BRT), então a fila é um ATRASO CONSTANTE, e não uma hora do dia em que ela
    # libera. Isso é o que torna o adiantamento útil: antecipar o cron antecipa a
    # execução na mesma medida — se fosse hora fixa, mudar o cron não mudaria nada.
    #
    # Daí 04:23 UTC. Somando a mediana da fila (4h48) e as ~3h do pipeline, a
    # lista fica pronta por volta das 09h BRT; no pior dia já visto, 12h30. Antes,
    # com 09:23, a mediana caía às 14h e o pior dia passava das 19h.
    #
    # Não adiantar além de 03:00 UTC: abaixo disso o dia em UTC ainda é o de
    # ontem no Brasil, e o varredura.mjs carimba parte do publicadores.json com a
    # data UTC (linha 875).
    #
    # O preço de rodar mais cedo: o edital publicado durante a manhã em Brasília
    # passa a entrar na lista do dia seguinte, porque a primeira janela fecha o
    # dia antes. Aceitável — o encerramento costuma estar a 8 dias úteis ou mais.
    - cron: '23 4 * * 1-5'      # 01:23 BRT — janela principal (roda ~06:11)
    - cron: '23 6 * * 1-5'      # 03:23 BRT — 1ª repescagem  (roda ~08:11)
    - cron: '23 8 * * 1-5'      # 05:23 BRT — 2ª repescagem  (roda ~10:11)
    # As três acima cabem todas antes do meio-dia. Esta guarda a tarde: é onde a
    # última tentativa caía com o horário antigo, e sem ela um dia em que as três
    # primeiras falhassem (como 07/09/2026, em que as três bateram no timeout)
    # ficaria sem nenhuma chance depois das 10h.
    - cron: '23 12 * * 1-5'     # 09:23 BRT — última chance   (roda ~14:11)
  workflow_dispatch:      # permite rodar na mão pelo botão "Run workflow"

# Sem isso o job não consegue commitar o dados.json de volta.
permissions:
  contents: write

# Duas execuções ao mesmo tempo dariam conflito no push.
concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    # 45 min matou a automacao sem avisar. Em 07/09/2026 as tres janelas do dia
    # foram canceladas, todas no passo "Varrer o PNCP", todas com exatos 45m15s:
    # o job nao falhou nem errou, bateu no teto — e o GitHub marca timeout como
    # "cancelled", que se confunde com cancelamento por concorrencia. O site
    # ficou parado de 04/09 a 08/09 e ninguem foi avisado, porque nao ha erro
    # para avisar.
    #
    # O teto era de quando a varredura levava 12 minutos. Ela cresceu: a consulta
    # de portal roda serializada por causa da cota do PNCP, e a fase de
    # exigencias baixa e le o PDF de cada edital da lista final.
    #
    # A duracao real, cronometrada em 08/09/2026 nesta maquina: 101 minutos
    # (07:29 as 09:10). Vale desconfiar de estimativa nao medida — a primeira
    # correcao deste teto foi para 90 minutos, em cima de um "uns 35 min" que
    # ninguem tinha cronometrado, e teria matado o job de novo.
    #
    # 150 minutos da meia hora de folga sobre a medida, para o PNCP ter um dia
    # ruim. Sobrar nao custa: a trava do passo seguinte faz a janela extra sair
    # na hora quando o dia ja foi publicado, e o repositorio e publico, onde o
    # minuto de Actions nao e cobrado.
    # 150 minutos cobriam so a varredura. Desde 10/09/2026 o job faz o pipeline
    # inteiro — varredura (101 min medidos), extracao do texto de cada edital
    # (50 min) e o recorte por item — e o usuario pediu o resultado pronto por
    # volta das 9h. Quem manda no horario de entrega nao e o cron, e a fila: com
    # o cron de 04:23 UTC a execucao comeca perto das 06h BRT e as ~3h de
    # trabalho terminam por volta das 09h (medidas de 16/09 a 23/09: 112, 128,
    # 179, 183, 189 e 238 minutos).
    #
    # 300 da o dobro de folga sobre a medida. Sobrar nao custa: a trava da
    # primeira etapa faz a janela extra sair na hora quando o dia ja foi
    # publicado, e o repositorio e publico, onde o minuto de Actions nao e
    # cobrado.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      # A repescagem só existe para o caso de a janela anterior não ter pegado vaga.
      # Se o dados.json que está no ar já é de hoje, não há o que fazer: sai antes de
      # gastar os 35 minutos da varredura. O disparo manual ignora a trava de
      # propósito — é o botão de "roda de novo mesmo assim".
      #
      # O dados.json lido é o do main de AGORA, não o do checkout. O job que
      # espera na fila guarda o commit de quando foi agendado: em 14/09/2026 a
      # repescagem partiu de um commit anterior à publicação do dia, leu a data
      # velha, refez as duas horas de varredura e caiu no push.
      - name: A varredura de hoje já está publicada?
        id: guarda
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          pub=$(git show origin/main:docs/dados.json | grep -o '"varredura":"[0-9-]\{10\}"' | head -1 | cut -d'"' -f4)
          echo "no ar: ${pub:-nenhuma} · hoje: $hoje · evento: ${{ github.event_name }}"
          if [ "$pub" = "$hoje" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "rodar=nao" >> "$GITHUB_OUTPUT"
            echo "A varredura de $hoje já está publicada — nada a fazer." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rodar=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guarda.outputs.rodar == 'sim'
        with:
          node-version: '24'

      - name: Guardar a versão anterior para comparar
        if: steps.guarda.outputs.rodar == 'sim'
        run: git show origin/main:docs/dados.json > /tmp/anterior.json 2>/dev/null || echo '{}' > /tmp/anterior.json

      - name: Varrer o PNCP
        if: steps.guarda.outputs.rodar == 'sim'
        run: node varredura.mjs

      - name: Gerar docs/dados.json
        if: steps.guarda.outputs.rodar == 'sim'
        run: node publicar.mjs

      # O link do botao "Participar" vem na consulta do portal, dentro da
      # varredura. Quem ficou sem (consulta que falhou) e buscado aqui de novo;
      # quando todos ja tem, o passo nao faz nenhuma requisicao.
      - name: Completar o link de participacao
        if: steps.guarda.outputs.rodar == 'sim'
        run: node links-portal.mjs

      # O tee manda o delta para o log ALÉM do Summary. O Summary não tem endpoint
      # na API REST, então sem isso o comparativo do dia só existe no navegador.
      - name: Resumo do que mudou
        if: steps.guarda.outputs.rodar == 'sim'
        run: |
          set -o pipefail
          node delta.mjs /tmp/anterior.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Trava de sanidade: lista vazia, encolhimento brusco ou muitas buscas
      # falhando derrubam o job ANTES do commit. Assim o dados.json de ontem
      # continua no ar — dado velho e inteiro é melhor que novo pela metade.
      - name: Conferir se o resultado faz sentido
        if: steps.guarda.outputs.rodar == 'sim'
        run: |
          { echo '### Sanidade'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          set +e
          node conferir.mjs /tmp/anterior.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          st=$?
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $st

      # O bsdtar abre o edital publicado em .rar (UFSM, 18/09/2026); sem ele o
      # arquivo fica nao lido, como antes. Falhar aqui nao derruba o job.
      - name: Ferramenta para abrir RAR
        if: steps.guarda.outputs.rodar == 'sim'
        continue-on-error: true
        run: sudo apt-get install -y -qq libarchive-tools || (sudo apt-get update -qq && sudo apt-get install -y -qq libarchive-tools)

      # O que faltava para a automacao servir sozinha. Ate 10/09/2026 o job
      # publicava so a LISTA de editais: quem entrasse no dia aparecia no site
      # sem uma linha de especificacao, porque o texto do edital era extraido a
      # mao depois. Agora o pipeline vai inteiro.
      #
      # Cada etapa baixa do PNCP, entao a rede pode falhar em uma sem que as
      # outras percam o trabalho: por isso cada uma e um passo, e o dados.json
      # so e commitado no fim.
      - name: Extrair o texto dos editais
        if: steps.guarda.outputs.rodar == 'sim'
        run: node descritivos.mjs

      # O PNCP devolve 502 de vez em quando, e o edital que tropeçou fica sem
      # texto — sem texto, nenhum item dele ganha descritivo. Em 11/09/2026
      # foram dois assim, Campina do Monte Alegre/SP e Santo Antônio do
      # Caiuá/PR, e uma segunda passada recuperou os dois.
      #
      # O --faltantes só refaz quem está sem texto: não mexe no que já deu
      # certo e custa poucos segundos quando não há o que recuperar.
      - name: Repescar os editais que o PNCP recusou
        if: steps.guarda.outputs.rodar == 'sim'
        run: node descritivos.mjs --faltantes

      # A copia do texto antes do recorte serve ao passo de publicar, que refaz
      # o recorte se o codigo mudar no main durante o job.
      - name: Embutir a lista de itens de cada edital
        if: steps.guarda.outputs.rodar == 'sim'
        run: |
          cp docs/descritivos.json /tmp/textos.json
          node itens-embutidos.mjs

      - name: Recortar o descritivo de cada item
        if: steps.guarda.outputs.rodar == 'sim'
        run: node descritivo-por-item.mjs

      # O item que o Termo de Referencia mostra ser de outro mercado (balanca
      # antropometrica, refrigerador de termolabeis...) so aparece depois do
      # recorte, e sai aqui; junto, os editais conferidos a mao que exigem o que
      # a casa nao atende (editais-fora.json). Revisao de 16/09/2026.
      - name: Vetar pelo descritivo
        if: steps.guarda.outputs.rodar == 'sim'
        run: node veta-pelo-descritivo.mjs

      # As auditorias nao derrubam o job: elas contam. O numero fica no Summary
      # do dia, e uma queda brusca aparece na comparacao com o dia anterior.
      - name: Auditar os descritivos
        if: steps.guarda.outputs.rodar == 'sim'
        run: |
          { echo '### Descritivos'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node confere-invasao.mjs | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          node confere-posicao.mjs | head -2 | tee -a "$GITHUB_STEP_SUMMARY"
          node confere-mistura.mjs | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
          node audita-descritivos.mjs | grep -E 'conferidos|comeca|teto|embaralhado|letras|rodape|fim de|repete' | tee -a "$GITHUB_STEP_SUMMARY"
          node confere-corte.mjs | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          node confere-numeracao.mjs | head -3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # A CAPA DO EDITAL fica de fora deste job, de proposito.
      #
      # O pagina-abertura.mjs recorta a folha de rosto de cada edital e guarda
      # em docs/aberturas.json, que tem 27 MB de PDF em base64. Versionar isso
      # todo dia poe ~20 MB por dia no historico do repositorio — em tres meses,
      # quase 2 GB, para um arquivo que o site nem consome (ele esta no
      # .gitignore desde que passou a viajar so dentro do artefato).
      #
      # Como so os editais NOVOS precisam de capa, o "node pagina-abertura.mjs
      # --faltantes" leva um ou dois minutos na maquina, e e rodado junto com o
      # artefato.mjs quando se quer o arquivo do dia.
      #
      # O job leva mais de duas horas, e nesse meio tempo o main pode andar.
      # Ate 15/09/2026 este passo fazia so "git push", que o GitHub recusa
      # quando o main ja nao e o commit de onde o job partiu: em 14/09 e 15/09
      # a varredura rodou inteira e se perdeu no ultimo passo.
      #
      # Agora ele guarda o que gerou, pula para o main atual e, se o codigo do
      # recorte mudou no caminho, refaz o recorte com o codigo novo — se o
      # codigo novo quebrar, publica o recorte do codigo antigo. Tenta tres
      # vezes, para outro push que caia entre o fetch e o push.
      - name: Publicar se houve mudança
        if: steps.guarda.outputs.rodar == 'sim'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/gerado
          cp docs/dados.json docs/descritivos.json publicadores.json /tmp/gerado/
          for tentativa in 1 2 3; do
            git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main
            cp /tmp/gerado/dados.json /tmp/gerado/descritivos.json docs/
            cp /tmp/gerado/publicadores.json .
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- '*.mjs' ortografia editais-fora.json descritivos-manuais.json; then
              echo "O codigo mudou no main durante o job: refazendo o recorte."
              cp /tmp/textos.json docs/descritivos.json
              if ! { node itens-embutidos.mjs && node descritivo-por-item.mjs && node veta-pelo-descritivo.mjs; }; then
                echo "O recorte novo falhou: publicando o do codigo antigo."
                cp /tmp/gerado/descritivos.json docs/
              fi
            fi
            if git diff --quiet -- docs/dados.json docs/descritivos.json publicadores.json; then
              echo "Nada mudou hoje — nenhum commit."
              exit 0
            fi
            git add docs/dados.json docs/descritivos.json publicadores.json
            git commit -m "Varredura de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            if git push origin HEAD:main; then exit 0; fi
            echo "O push foi recusado (tentativa $tentativa); tentando de novo."
            sleep 20
          done
          exit 1
